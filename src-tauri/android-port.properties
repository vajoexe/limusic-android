# The Android port's version, the one place it is set.
#
# The port's version is `<upstream>-universal-android.<revision>`, e.g. 1.4.0-rc.3-universal-android.2:
#   <upstream>  the desktop version it is built on: the Cargo workspace version, release candidate
#               included (1.4.0-rc.3). Not repeated here.
#   universal   the APK carries both arm64-v8a and x86_64.
#   <revision>  below: 1 for the first Android release of an upstream version, +1 for each release
#               after it on that same upstream version, back to 1 when the port moves to a new one.
#
# Gradle (versionName, versionCode), the About page, the update check and the release APK's file
# name all read it from here. See src-tauri/src/port_version.rs.
revision=3
