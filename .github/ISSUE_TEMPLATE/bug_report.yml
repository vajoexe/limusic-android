name: Something is broken
description: Report a bug. Two questions, the rest is optional.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What went wrong?
      description: In your own words. What you did, and what the app did instead.
      placeholder: I pressed play on a song and nothing happened, the bar at the bottom stayed empty.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Which device?
      options:
        - Android phone
        - Android tablet or foldable
        - Samsung DeX or desktop windowing
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Which version of Limusic?
      description: Settings, About tab. Skip this if you cannot find it.
      placeholder: "1.4.0-rc.3"

  - type: textarea
    id: system
    attributes:
      label: System details
      description: >
        Settings, About tab, "Open the bug form" fills this in for you. Leave it blank if you
        got here another way.
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: >
        All optional, whatever you have. A screenshot or a screen recording, your
        phone model and Android version, or where you got the APK. Drag images straight into this box.
